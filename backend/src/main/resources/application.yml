# `.env` is optional and git-ignored. Real deployments should inject real
# environment variables instead of shipping a file.
spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: medhelp-backend

  datasource:
    url: ${DB_URL:${JDBC_DATABASE_URL:}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase (and most managed Postgres) drop idle connections aggressively.
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 15000
      max-lifetime: 240000

  jpa:
    hibernate:
      # `update` keeps the 3-day demo simple. A real deployment would use
      # versioned migrations (Flyway/Liquibase) instead.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  jackson:
    default-property-inclusion: non_null

server:
  # Render (and most PaaS) inject PORT and requires the app to bind to it;
  # SERVER_PORT still wins for local runs, and 8080 remains the fallback.
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

medhelp:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${STORAGE_LOCAL_PATH:./storage}
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_KEY:}
    supabase-bucket: ${SUPABASE_BUCKET:medical-documents}
    signed-url-seconds: ${SUPABASE_SIGNED_URL_SECONDS:300}
  seed-demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    com.medhelp: INFO
    org.hibernate.SQL: WARN
